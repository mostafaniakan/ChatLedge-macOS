name: Build release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag that receives ChatLedge.zip
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    name: Package ChatLedge
    runs-on: macos-13
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish || github.sha }}

      - name: Build release archive
        run: bash build.sh

      - name: Attach archive to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" build/ChatLedge.zip --clobber
