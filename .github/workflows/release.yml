name: Build release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    name: Package ChatLedge
    runs-on: macos-14

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.target_commitish }}

      - name: Build release archive
        run: bash build.sh

      - name: Attach archive to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/ChatLedge.zip --clobber
